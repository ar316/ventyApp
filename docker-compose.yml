services:

  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_DB: venty_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d venty_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: springboot_app
    restart: always

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/venty_db
      DB_USERNAME: root
      DB_PASSWORD: root

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: